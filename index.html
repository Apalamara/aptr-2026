const {useState,useMemo,useEffect,useRef,useCallback}=React;
const {Plus,Circle,CheckCircle2,Edit2,ArrowLeft,X,Download,Upload,Trash2,MoreVertical,Calendar,Sparkles,Inbox,Target,Layers,CheckSquare,Clock,AlertCircle,FileText,ExternalLink,RefreshCw,Copy,List,Zap,ChevronDown,Filter,Search}=window.LucideIcons;

const todayStr=()=>new Date().toISOString().split('T')[0];
const idEq=(a,b)=>a!=null&&b!=null&&String(a)===String(b);
// vencida = pendiente con vencimiento anterior a hoy. `today` va normalizado a 00:00.
function isOverdueTask(t,today){
  if(t.status==='done'||!t.dueDate)return false;
  const d=new Date(t.dueDate+'T00:00:00');d.setHours(0,0,0,0);
  return d<today;
}
function tomorrowStr(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().split('T')[0];}
function nextMondayStr(){const d=new Date();const day=d.getDay();const diff=day===0?1:(8-day);d.setDate(d.getDate()+diff);return d.toISOString().split('T')[0];}
function nextFridayStr(){const d=new Date(nextMondayStr()+'T00:00:00');d.setDate(d.getDate()+4);return d.toISOString().split('T')[0];}
function formatDate(d){
  if(!d)return'—';
  const date=new Date(d+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);
  const dd=new Date(date);dd.setHours(0,0,0,0);
  if(dd.getTime()===today.getTime())return'Hoy';
  const tom=new Date(today);tom.setDate(today.getDate()+1);
  if(dd.getTime()===tom.getTime())return'Mañana';
  return date.toLocaleDateString('es-AR',{day:'numeric',month:'short'});
}
function isOverdue(due,status){
  if(status==='done'||!due)return false;
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(due+'T00:00:00');d.setHours(0,0,0,0);
  return d<today;
}
function isToday(d){
  if(!d)return false;
  const today=new Date();today.setHours(0,0,0,0);
  const dd=new Date(d+'T00:00:00');dd.setHours(0,0,0,0);
  return dd.getTime()===today.getTime();
}
function isProjectDone(project){
  const t=project.tasks.length;
  if(t===0)return false;
  return project.tasks.every(t=>t.status==='done');
}
function calcDays(end){
  if(!end)return null;
  const days=Math.ceil((new Date(end)-new Date())/86400000);
  return{days,isOv:days<0};
}
function getProgressColor(p){return p>=60?'#0f8a4a':p>=30?'#9a6a00':'#c8324a';}
function ringOffset(pct){return 100.5-(pct*100.5/100);}
function ringColor(pct){return pct>=60?'#0f8a4a':pct>=30?'#9a6a00':'#c8324a';}
function extractUrls(text){return(text||'').match(/(https?:\/\/[^\s]+)/g)||[];}
const MES_ES={1:'Ene',2:'Feb',3:'Mar',4:'Abr',5:'May',6:'Jun',7:'Jul',8:'Ago',9:'Sep',10:'Oct',11:'Nov',12:'Dic'};
const MES_LARGO=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function nextRecurDate(date,recur){
  const d=new Date(date+'T00:00:00');
  if(recur==='daily')d.setDate(d.getDate()+1);
  else if(recur==='every3days')d.setDate(d.getDate()+3);
  else if(recur==='weekly')d.setDate(d.getDate()+7);
  else if(recur==='biweekly')d.setDate(d.getDate()+14);
  else if(recur==='monthly')d.setMonth(d.getMonth()+1);
  return d.toISOString().split('T')[0];
}
function genRecurInstances(name,startDate,endDate,recur){
  const tasks=[];let cur=startDate;
  const max=new Date(endDate+'T00:00:00');let i=1;
  while(new Date(cur+'T00:00:00')<=max&&i<=365){
    tasks.push({id:Date.now()*10000+i,name:`${name} ${i}`,status:'pending',doDate:cur,dueDate:cur,note:'',subtasks:[],recur,recurBase:name,recurIndex:i});
    cur=nextRecurDate(cur,recur);i++;
  }
  return tasks;
}
const RECUR_LABELS={'':'Sin repetición',daily:'Cada día',every3days:'Cada 3 días',weekly:'Cada semana',biweekly:'Cada 2 semanas',monthly:'Cada mes'};

const VERSE_FALLBACK={text:'Confía en el Señor con todo tu corazón, y no te apoyes en tu propio entendimiento.',ref:'Proverbios 3:5',src:'BibleGateway NVI'};

function useVerseOfTheDay(){
  const[verse,setVerse]=useState(()=>{
    try{const c=localStorage.getItem('aptr-votd');if(c){const p=JSON.parse(c);if(p&&p.date===todayStr()&&p.text)return p;}}catch{}
    return VERSE_FALLBACK;
  });
  useEffect(()=>{
    try{const c=localStorage.getItem('aptr-votd');if(c){const p=JSON.parse(c);if(p&&p.date===todayStr()&&p.text){setVerse(p);return;}}}catch{}
    try{
      fetch('https://www.biblegateway.com/votd/get/?format=json&version=NVI')
        .then(r=>{if(!r.ok)throw new Error();return r.json();})
        .then(d=>{
          if(d&&d.votd&&d.votd.text){
            const txt=(d.votd.text||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&#?\w+;/g,'').trim();
            const v={text:txt,ref:d.votd.display_ref||d.votd.reference||'',src:'BibleGateway NVI',date:todayStr()};
            localStorage.setItem('aptr-votd',JSON.stringify(v));
            setVerse(v);
          }
        }).catch(()=>{});
    }catch(e){}
  },[]);
  return verse;
}

// ── Circuito de cobro Open Pay (área Finanzas) ──────────────────────────
const FINANZAS_PROJECT_ID=1;
const OPENPAY_TASKS=[
  {id:'fin-op-pedir',base:'Pedir transferencia de Open Pay a mi hermana',doDay:1,dueDay:9},
  {id:'fin-op-banco',base:'Transferirme la plata a mi banco',doDay:3,dueDay:11},
];
// Arranca en el primer mes en que todavía se llega a pedir la transferencia
function firstOpenPayMonth(){
  const n=new Date();let y=n.getFullYear(),m=n.getMonth();
  if(n.getDate()>OPENPAY_TASKS[0].dueDay){m++;if(m>11){m=0;y++;}}
  return{y,m};
}
function buildOpenPayTasks(){
  const{y,m}=firstOpenPayMonth();
  const iso=day=>`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  return OPENPAY_TASKS.map(t=>({id:t.id,name:`${t.base} 1`,status:'pending',doDate:iso(t.doDay),dueDate:iso(t.dueDay),note:'',subtasks:[],recur:'monthly',recurMode:'onComplete',recurBase:t.base,recurIndex:1}));
}

const CASA_AREA_ID='area-casa';
const CASA_PROJECT_ID='proj-casa-2026';
// Pendientes de casa: sin fecha a propósito, se hacen cuando hay un rato
const CASA_TASKS=[
  'Limpieza del sillón',
  'Cambiar las cortinas',
  'Cambiar las sillas del comedor',
  'Colgar la tele',
  'Arreglar la luz del pasillo',
];
function buildCasaTasks(){
  return CASA_TASKS.map((name,i)=>({id:`casa-${i+1}`,name,status:'pending',doDate:'',dueDate:'',note:'',subtasks:[]}));
}
// Palabra clave de cada tarea sembrada, para reconocer si ya existía una equivalente
const CASA_SEED_KEYS={'casa-1':'sillon','casa-2':'cortina','casa-3':'comedor','casa-4':'tele','casa-5':'pasillo'};
const normTxt=t=>(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

// Pendientes de Gordos: sin fecha, son cosas para explorar cuando haya rato
const GORDOS_TASKS=[
  'Ordenar los pins de Gordos',
  'Gema que convierte cosas en stickers',
  'Probar Pomelli y ver qué me crea',
  'Ver qué tipo de fotos puedo crear con onda retro',
];
const GORDOS_KEYS=['pins','sticker','pomelli','retro'];

const EGG_TASK_NAME='Chequear cuánto dura realmente la sesión y qué pasó con la gente cursando';

// ── Migraciones de datos (corren una sola vez, después de sincronizar) ──
const MIGRATIONS=[
  {id:'fin-openpay-v1',apply:d=>{
    const proj=d.projects.find(p=>idEq(p.id,FINANZAS_PROJECT_ID));
    if(!proj)return d;
    const nuevas=buildOpenPayTasks().filter(nt=>!proj.tasks.some(t=>idEq(t.id,nt.id)||t.recurBase===nt.recurBase));
    if(!nuevas.length)return d;
    return{...d,projects:d.projects.map(p=>idEq(p.id,FINANZAS_PROJECT_ID)?{...p,tasks:[...p.tasks,...nuevas]}:p)};
  }},
  {id:'casa-2026-v1',apply:d=>{
    const areas=d.areas.some(a=>idEq(a.id,CASA_AREA_ID))?d.areas
      :[...d.areas,{id:CASA_AREA_ID,name:'Casa',emoji:'🏠',vision:'Que la casa sea un lugar lindo para estar',color:'#0EA5E9'}];
    if(d.projects.some(p=>idEq(p.id,CASA_PROJECT_ID)))return{...d,areas};
    return{...d,areas,projects:[...d.projects,{id:CASA_PROJECT_ID,name:'Casa 2026',description:'Cositas para mejorar la casa, sin apuro',areaId:CASA_AREA_ID,year:2026,startDate:'2026-01-01',endDate:'',tasks:buildCasaTasks()}]};
  }},
  // Las tareas "[CASA] ..." que ya vivían en otros proyectos se mudan a Casa 2026
  {id:'casa-2026-v2',apply:d=>{
    const proj=d.projects.find(p=>idEq(p.id,CASA_PROJECT_ID));
    if(!proj)return d;
    const hoy=todayStr(),movidas=[];
    const projects=d.projects.map(p=>{
      if(idEq(p.id,CASA_PROJECT_ID))return p;
      const quedan=[],van=[];
      (p.tasks||[]).forEach(t=>{
        if(!/\[\s*casa\s*\]/i.test(t.name||'')){quedan.push(t);return;}
        // conserva nota, subtareas y estado; si arrastraba un vencimiento pasado,
        // la manda a "Algún día" en vez de dejarla en rojo
        const vencida=t.status!=='done'&&t.dueDate&&t.dueDate<hoy;
        van.push({...t,name:(t.name||'').replace(/\[\s*casa\s*\]\s*/i,'').trim(),doDate:vencida?'':t.doDate,dueDate:vencida?'':t.dueDate});
      });
      if(!van.length)return p;
      movidas.push(...van);
      return{...p,tasks:quedan};
    });
    if(!movidas.length)return d;
    // saca la tarea sembrada solo si sigue intacta y la mudada ya la cubre
    const nombres=movidas.map(t=>normTxt(t.name));
    const limpio=proj.tasks.filter(t=>{
      const k=CASA_SEED_KEYS[t.id];
      if(!k||t.status!=='pending'||(t.note||'').trim()||(t.subtasks||[]).length)return true;
      return !nombres.some(n=>n.includes(k));
    });
    return{...d,projects:projects.map(p=>idEq(p.id,CASA_PROJECT_ID)?{...p,tasks:[...limpio,...movidas]}:p)};
  }},
  // Gordos vive en Emprendimiento. Busca proyecto y área por nombre porque los
  // ids reales no viven en el repo; solo crea lo que falte.
  {id:'gordos-v1',apply:d=>{
    let areas=d.areas,projects=d.projects;
    let proj=projects.find(p=>normTxt(p.name).includes('gordos'));
    if(!proj){
      let area=areas.find(a=>normTxt(a.name).includes('emprendimiento'));
      if(!area){area={id:'area-emprendimiento',name:'Emprendimiento',emoji:'🚀',vision:'Hacer crecer mis proyectos propios',color:'#F97316'};areas=[...areas,area];}
      proj={id:'proj-gordos',name:'Gordos',description:'',areaId:area.id,year:2026,startDate:'2026-01-01',endDate:'',tasks:[]};
      projects=[...projects,proj];
    }
    // no repite una tarea que ya exista en el proyecto (por id o por palabra clave)
    const previas=proj.tasks.map(t=>normTxt(t.name));
    const nuevas=GORDOS_TASKS.map((name,i)=>({id:`gordos-${i+1}`,name,status:'pending',doDate:'',dueDate:'',note:'',subtasks:[]}))
      .filter((nt,i)=>!proj.tasks.some(t=>idEq(t.id,nt.id))&&!previas.some(n=>n.includes(GORDOS_KEYS[i])));
    if(!nuevas.length)return{...d,areas,projects};
    return{...d,areas,projects:projects.map(p=>idEq(p.id,proj.id)?{...p,tasks:[...p.tasks,...nuevas]}:p)};
  }},
  // Chequeo de duración de la sesión en Egg - AI power
  {id:'egg-aipower-v1',apply:d=>{
    let areas=d.areas,projects=d.projects;
    let proj=projects.find(p=>normTxt(p.name).includes('power'));
    if(!proj){
      let area=areas.find(a=>normTxt(a.name).includes('trabajo'));
      if(!area){area={id:'area-trabajo',name:'Trabajo',emoji:'💼',vision:'Desarrollar mis proyectos',color:'#8B5CF6'};areas=[...areas,area];}
      proj={id:'proj-egg-aipower',name:'Egg - AI power',description:'',areaId:area.id,year:2026,startDate:'2026-01-01',endDate:'',tasks:[]};
      projects=[...projects,proj];
    }
    if(proj.tasks.some(t=>idEq(t.id,'egg-sesion-1')||normTxt(t.name).includes('dura realmente la sesion')))return{...d,areas,projects};
    const nueva={id:'egg-sesion-1',name:EGG_TASK_NAME,status:'pending',doDate:'',dueDate:'',note:'',subtasks:[]};
    return{...d,areas,projects:projects.map(p=>idEq(p.id,proj.id)?{...p,tasks:[...p.tasks,nueva]}:p)};
  }},
];
function applyMigrations(d){
  const done=d.migrations||[];
  const pend=MIGRATIONS.filter(m=>!done.includes(m.id));
  if(!pend.length)return d;
  let out=d;
  pend.forEach(m=>{out=m.apply(out);});
  return{...out,migrations:[...done,...pend.map(m=>m.id)]};
}

  },[textLines,tDate,tFreq,tDateMode]);
  const[adding,setAdding]=useState(false);
  const handleAdd=()=>{
    if(adding)return;
    const preview=tab==='pattern'?patternPreview:textPreview;
    const pid=tab==='pattern'?pProject:tProject;
    if(!preview.length||!pid)return;
    setAdding(true);
    let batchCounter=0;
    const tasks=preview.map(({name,date})=>({id:Date.now()*10000+(++batchCounter)+Math.floor(Math.random()*9999),name,status:'pending',doDate:date,dueDate:date,note:'',subtasks:[]}));
    onAdd(pid,tasks);onClose();
  };
  const preview=tab==='pattern'?patternPreview:textPreview;
  return(
    <Modal title="Carga en lote" onClose={onClose} wide>
      <div className="tab-row">
        <button className={`tab-btn${tab==='pattern'?' on':''}`} onClick={()=>setTab('pattern')}><Zap size={12}/> Por patrón</button>
        <button className={`tab-btn${tab==='text'?' on':''}`} onClick={()=>setTab('text')}><List size={12}/> Por lista de texto</button>
      </div>
      {tab==='pattern'&&(<>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div style={{gridColumn:'1/-1'}}><label className="flabel">Nombre base</label><input className="finput" value={pName} onChange={e=>setPName(e.target.value)} placeholder="Ej: Leer, Estudiar…"/></div>
          <div><label className="flabel">Desde</label><input type="date" className="finput" value={pStart} onChange={e=>setPStart(e.target.value)}/></div>
          <div><label className="flabel">Hasta</label><input type="date" className="finput" value={pEnd} onChange={e=>setPEnd(e.target.value)}/></div>
        </div>
        <div><label className="flabel">Frecuencia</label>
          <select className="finput fselect" value={pFreq} onChange={e=>setPFreq(e.target.value)}>
            <option value="daily">Cada día</option><option value="weekly">Cada semana</option><option value="biweekly">Cada 2 semanas</option><option value="monthly">Cada mes</option>
          </select>
        </div>
        <div><label className="flabel">Sufijo</label>
          <div style={{display:'flex',gap:6}}>
            <button className={`recur-mode-btn${pSuffix==='date'?' on':''}`} onClick={()=>setPSuffix('date')}>📅 Fecha</button>
            <button className={`recur-mode-btn${pSuffix==='number'?' on':''}`} onClick={()=>setPSuffix('number')}>🔢 Número</button>
          </div>
        </div>
        <div><label className="flabel">Proyecto</label>
          <select className="finput fselect" value={pProject||''} onChange={e=>setPProject(e.target.value)}>
            {projects.map(p=>{const a=areas.find(a=>idEq(a.id,p.areaId));return<option key={p.id} value={p.id}>{a?.emoji} {p.name}</option>;})}
          </select>
        </div>
      </>)}
      {tab==='text'&&(<>
        <div><label className="flabel">Lista (una por línea)</label><textarea className="finput" rows={6} value={tText} onChange={e=>setTText(e.target.value)} placeholder={"Cap 1\nCap 2\nCap 3"} style={{resize:'vertical'}}/></div>
        <div><label className="flabel">Proyecto</label>
          <select className="finput fselect" value={tProject||''} onChange={e=>setTProject(e.target.value)}>
            {projects.map(p=>{const a=areas.find(a=>idEq(a.id,p.areaId));return<option key={p.id} value={p.id}>{a?.emoji} {p.name}</option>;})}
          </select>
        </div>
        <div><label className="flabel">Fechas</label>
          <div style={{display:'flex',gap:5,marginBottom:8}}>
            <button className={`recur-mode-btn${tDateMode==='same'?' on':''}`} onClick={()=>setTDateMode('same')}>Misma fecha</button>
            <button className={`recur-mode-btn${tDateMode==='seq'?' on':''}`} onClick={()=>setTDateMode('seq')}>Secuencial</button>
          </div>
          <input type="date" className="finput" value={tDate} onChange={e=>setTDate(e.target.value)}/>
          {tDateMode==='seq'&&<div style={{marginTop:8}}><label className="flabel">Separación</label><select className="finput fselect" value={tFreq} onChange={e=>setTFreq(e.target.value)}><option value="daily">Cada día</option><option value="weekly">Cada semana</option><option value="biweekly">Cada 2 semanas</option><option value="monthly">Cada mes</option></select></div>}
        </div>
      </>)}
      {preview.length>0&&(
        <div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}><label className="flabel" style={{margin:0}}>Vista previa</label><span className="count-badge">{preview.length} tareas</span></div>
          <div className="preview-list">
            {preview.slice(0,50).map((t,i)=><div key={i} className="preview-item"><Circle size={9} style={{flexShrink:0,color:'var(--tx3)'}}/><span className="pi-name">{t.name}</span><span className="pi-date">{formatDate(t.date)}</span></div>)}
            {preview.length>50&&<div style={{textAlign:'center',fontSize:11,color:'var(--tx3)',padding:'6px 0'}}>+{preview.length-50} más…</div>}
          </div>
        </div>
      )}
      <button className="btn btn-pri" style={{width:'100%',justifyContent:'center',padding:'11px'}} disabled={!preview.length} onClick={handleAdd}><Zap size={14}/> Crear {preview.length} tarea{preview.length!==1?'s':''}</button>
    </Modal>
  );
}

        <button className="abar-btn danger" title="Eliminar" onClick={()=>onDelete(task.id)}><Trash2 size={13}/></button>

  );

function PVProjectCard({project,area,onToggleTask,onEditTask,onDeleteTask,onOpenSheet,onAddInlineTask,onEditProject,onToggleSubtask,onAddSubtask,onDeleteSubtask,onUpdateSubtaskDate,onUpdateSubtaskName,statusFilter,showArea}){
  const[open,setOpen]=useState(false);
  const[cap,setCap]=useState('');
  const total=project.tasks.length;
  const done=project.tasks.filter(t=>t.status==='done').length;
  const pct=total>0?Math.round((done/total)*100):0;
  const projDone=isProjectDone(project);
  // Only show deadline chip if project is NOT done
  const di=!projDone?calcDays(project.endDate):null;
  const areaColor=area?.color||'var(--ac)';
  let chipCls='pv-chip-ok',chipLabel=null;
  if(projDone){chipCls='pv-chip-done';chipLabel='Completado ✓';}
  else if(di&&(di.isOv||di.days<=30)){
    chipLabel=di.isOv?`${Math.abs(di.days)}d atraso`:`${di.days}d restantes`;
    chipCls=di.isOv?'pv-chip-ov':'pv-chip-soon';
  }
  const filteredTasks=useMemo(()=>{
    let list=[...project.tasks].sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
    if(statusFilter==='pending')list=list.filter(t=>t.status!=='done');
    else if(statusFilter==='done')list=list.filter(t=>t.status==='done');
    return list;
  },[project.tasks,statusFilter]);
  const EIc=()=><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
  const ChevIc=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>;
  return(
    <div className={`pv-card${open?' open':''}`}>
      <div className="pv-row" onClick={()=>setOpen(p=>!p)}>
        <div className="pv-stripe" style={{background:areaColor}}/>
        <div className="pv-info">
          <div className="pv-name">{project.name}</div>
          <div className="pv-meta">
            {showArea&&area&&<span className="pv-mp">{area.emoji} {area.name}</span>}
            <div className="pv-bar" title={`${pct}%`}><div className="pv-bar-fill" style={{width:`${pct}%`,background:areaColor}}/></div>
            <span className="pv-mp">{done}/{total}</span>
            {chipLabel&&<span className={`chip ${chipCls}`}>{chipLabel}</span>}
          </div>
        </div>
        <button className="pv-edit" onClick={e=>{e.stopPropagation();onEditProject(project);}}><EIc/></button>
        <div className="pv-chev"><ChevIc/></div>
      </div>
      <div className="pv-drawer">
        {project.description&&<div className="pv-dmeta"><div className="pv-desc">{project.description}</div></div>}
        <div style={{paddingTop:3}}>
          {filteredTasks.length===0&&<div style={{textAlign:'center',padding:'12px 0',fontSize:12,color:'var(--tx3)'}}>Sin tareas {statusFilter==='pending'?'pendientes':statusFilter==='done'?'completadas':'aún'}</div>}
          {filteredTasks.map(task=>(
            <PVTaskRow key={task.id} task={task} onToggle={onToggleTask} onEdit={onEditTask} onDelete={onDeleteTask} onOpenSheet={onOpenSheet} onToggleSubtask={onToggleSubtask} onAddSubtask={onAddSubtask} onDeleteSubtask={onDeleteSubtask} onUpdateSubtaskDate={onUpdateSubtaskDate} onUpdateSubtaskName={onUpdateSubtaskName}/>
          ))}
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'9px 13px 11px',borderTop:filteredTasks.length>0?'1px solid var(--bd)':'none'}}>
            <span style={{width:19,height:19,borderRadius:'50%',border:'1.5px solid var(--bdh)',flexShrink:0}}/>
            <input style={{flex:1,background:'none',border:'none',borderBottom:'1px solid var(--bdh)',fontSize:13,color:'var(--tx)',outline:'none',padding:'2px 0',fontFamily:'inherit'}} placeholder="Nueva tarea… (Enter)" value={cap} onChange={e=>setCap(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&cap.trim()){onAddInlineTask(project.id,cap.trim());setCap('');}if(e.key==='Escape')setCap('');}}/>
            {cap&&<button className="btn-icon" onClick={()=>setCap('')}><X size={12}/></button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function APTRPlanner(){
  let _idCounter=0;
  const uid=()=>Date.now()*10000+(++_idCounter);
  const _skipFbRef=useRef(false);
  const _mountedRef=useRef(false);
  const _fbSaveTimer=useRef(null);
  const _fbSynced=useRef(false);
  const _localPending=useRef(false);
  const getInit=()=>{
    try{
      const s=localStorage.getItem('aptr-v14');
      if(!s)return getInitialData();
      const parsed=JSON.parse(s);
      if(parsed&&parsed.areas&&parsed.projects)return parsed;
      console.error('APTR: datos corruptos, usando backup');
      const bk=localStorage.getItem('aptr-v14-backup');
      if(bk){const bkp=JSON.parse(bk);if(bkp&&bkp.areas&&bkp.projects)return bkp;}
      return getInitialData();
    }catch(e){
      console.error('APTR: error leyendo datos',e);
      try{const bk=localStorage.getItem('aptr-v14-backup');if(bk){const bkp=JSON.parse(bk);if(bkp&&bkp.areas&&bkp.projects)return bkp;}}catch{}
      return getInitialData();
    }
  };
  const[data,setData]=useState(getInit);
  const[syncStatus,setSyncStatus]=useState('loading');
  const dailyVerse=useVerseOfTheDay();
  const[view,setView]=useState('tasks');
  const[taskFilter,setTaskFilter]=useState('open'); // ← default: abiertas
  const[projStatusFilter,setProjStatusFilter]=useState('pending');
  const[projProjectFilter,setProjProjectFilter]=useState('all'); // 'all' | projectId
  const[selAreaId,setSelAreaId]=useState(null);
  const[editingAreaId,setEditingAreaId]=useState(null);
  const inboxRef=useRef(null);
  const[showNewTask,setShowNewTask]=useState(false);
  const[showNewProject,setShowNewProject]=useState(false);
  const[showNewArea,setShowNewArea]=useState(false);
  const[showMenu,setShowMenu]=useState(false);
  const[showBatch,setShowBatch]=useState(false);
  const[newTask,setNewTask]=useState({name:'',doDate:'',dueDate:'',projectId:null,note:'',recur:'',recurMode:'onComplete',recurEnd:''});
  const[newProject,setNewProject]=useState({name:'',areaId:null,startDate:'',endDate:'',description:''});
  const[newArea,setNewArea]=useState({name:'',emoji:'📁',vision:'',color:'#ff647c'});
  const[newInbox,setNewInbox]=useState('');
  const[showInboxCap,setShowInboxCap]=useState(false);
  const[showEditTask,setShowEditTask]=useState(false);
  const[editTaskForm,setEditTaskForm]=useState({id:null,name:'',doDate:'',dueDate:'',projectId:null,note:'',recur:'',recurMode:'onComplete',recurEnd:''});
  const[assignInboxId,setAssignInboxId]=useState(null);
  const[editInboxId,setEditInboxId]=useState(null);
  const[editInboxText,setEditInboxText]=useState('');
  const[pvSheet,setPvSheet]=useState(null);
  const[editingProject,setEditingProject]=useState(null);
  const[searchQuery,setSearchQuery]=useState('');
  const[calMonth,setCalMonth]=useState(()=>new Date().getMonth());
  const[calYear,setCalYear]=useState(()=>new Date().getFullYear());
  const[calSelDay,setCalSelDay]=useState(null);
  const[undoStack,setUndoStack]=useState(null);
  const undoTimer=useRef(null);
  const pushUndo=(msg)=>{if(undoTimer.current)clearTimeout(undoTimer.current);setUndoStack({msg,data:JSON.parse(JSON.stringify(data))});undoTimer.current=setTimeout(()=>setUndoStack(null),5000);};
  const doUndo=()=>{if(!undoStack)return;setData(undoStack.data);setUndoStack(null);if(undoTimer.current)clearTimeout(undoTimer.current);};

  // Save to localStorage + Firebase (debounced)
  useEffect(()=>{
    const fromFb=_skipFbRef.current;
    const firstRun=!_mountedRef.current;
    _mountedRef.current=true;
    try{
      const json=JSON.stringify(data);
      localStorage.setItem('aptr-v14',json);
      localStorage.setItem('aptr-v14-backup',json);
      // marca de tiempo de la ultima edicion LOCAL (en segundos, igual que _ts de Firestore)
      if(!fromFb&&!firstRun)localStorage.setItem('aptr-v14-ts',String(Math.floor(Date.now()/1000)));
    }catch(e){console.error('APTR: error guardando',e);}
    // en el primer render todavia no cargo Firestore: no pisar la nube con lo local
    if(fromFb||firstRun){_skipFbRef.current=false;if(_fbSaveTimer.current){clearTimeout(_fbSaveTimer.current);_fbSaveTimer.current=null;}return;}
    _localPending.current=true;
    if(_fbSaveTimer.current)clearTimeout(_fbSaveTimer.current);
    _fbSaveTimer.current=setTimeout(()=>{
      if(window._fb){
        setSyncStatus('saving');
        window._fb.save({areas:data.areas,projects:data.projects,inbox:data.inbox||[],migrations:data.migrations||[]}).then(()=>{setSyncStatus('synced');setTimeout(()=>{_localPending.current=false;},2000);}).catch(()=>{setSyncStatus('error');_localPending.current=false;});
      } else {_localPending.current=false;}
    },800);
  },[data]);
  // beforeunload — save to localStorage
  useEffect(()=>{
    const save=()=>{try{localStorage.setItem('aptr-v14',JSON.stringify(data));}catch{}};
    window.addEventListener('beforeunload',save);
    return()=>window.removeEventListener('beforeunload',save);
  },[data]);
  // Firebase: load initial data + listen for real-time changes
  useEffect(()=>{
    if(!window._fb)return;
    let unsub;
    window._fb.load().then(fbData=>{
      if(fbData&&fbData.areas&&fbData.projects){
        const localTs=localStorage.getItem('aptr-v14-ts');
        const fbTs=fbData._ts?.seconds||0;
        if(!localTs||fbTs>Number(localTs)){
          _skipFbRef.current=true;
          setData({areas:fbData.areas,projects:fbData.projects,inbox:fbData.inbox||[],migrations:fbData.migrations||[]});
        } else {
          // lo local quedo mas nuevo que la nube: lo subo yo
          window._fb.save({areas:data.areas,projects:data.projects,inbox:data.inbox||[],migrations:data.migrations||[]});
        }
      } else {
        // no hay documento todavia: subo lo local
        window._fb.save({areas:data.areas,projects:data.projects,inbox:data.inbox||[],migrations:data.migrations||[]});
      }
      setSyncStatus('synced');
      _fbSynced.current=true;
      unsub=window._fb.listen(snap=>{
        if(!snap||!snap.areas||!snap.projects)return;
        if(_localPending.current)return;
        _skipFbRef.current=true;
        setData(prev=>{
          const incoming=JSON.stringify({areas:snap.areas,projects:snap.projects,inbox:snap.inbox||[]});
          const current=JSON.stringify({areas:prev.areas,projects:prev.projects,inbox:prev.inbox||[]});
          if(incoming===current)return prev;
          setSyncStatus('synced');
          return{areas:snap.areas,projects:snap.projects,inbox:snap.inbox||[],migrations:snap.migrations||prev.migrations||[]};
        });
      });
    }).catch(()=>setSyncStatus('offline'));
    return()=>{if(unsub)unsub();};
  },[]);

  // Migraciones: corren una sola vez por dato, recién después de sincronizar
  const _migDone=useRef(false);
  useEffect(()=>{
    if(_migDone.current)return;
    if(window._fb&&syncStatus!=='synced'&&syncStatus!=='offline')return;
    _migDone.current=true;
    setData(prev=>applyMigrations(prev));
  },[syncStatus]);

  useEffect(()=>{
    const handleKey=e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='n'){
        e.preventDefault();
        setShowNewTask(true);
      }
    };
    window.addEventListener('keydown',handleKey);
    return()=>window.removeEventListener('keydown',handleKey);
  },[]);

  const yr=new Date().getFullYear();
  const projects=useMemo(()=>data.projects.filter(p=>p.year===yr).sort((a,b)=>new Date(a.startDate||'9999')-new Date(b.startDate||'9999')),[data.projects]);

  const allTasks=useMemo(()=>{
    const t=[];
    projects.forEach(p=>{const a=data.areas.find(a=>idEq(a.id,p.areaId));p.tasks.forEach(tk=>t.push({...tk,projectId:p.id,projectName:p.name,areaColor:a?.color}));});
    return t.sort((a,b)=>new Date(a.doDate)-new Date(b.doDate));
  },[projects,data.areas]);

  // Subtareas con fecha — para calendario y semana
  const allSubtasks=useMemo(()=>{
    const s=[];
    projects.forEach(p=>{const a=data.areas.find(a=>idEq(a.id,p.areaId));p.tasks.forEach(tk=>{(tk.subtasks||[]).forEach(st=>{if(st.dueDate)s.push({...st,parentTaskId:tk.id,parentTaskName:tk.name,projectId:p.id,projectName:p.name,areaColor:a?.color,isSubtask:true,doDate:st.dueDate});});});});
    return s;
  },[projects,data.areas]);

  const streaks=useMemo(()=>{
    const map={};
    allTasks.filter(t=>t.recurBase).forEach(t=>{
      const key=t.recurBase+'|'+t.projectId;
      if(!map[key])map[key]=[];
      map[key].push(t);
    });
    const result={};
    Object.values(map).forEach(group=>{
      group.sort((a,b)=>(b.recurIndex||0)-(a.recurIndex||0));
      let streak=0;
      for(const t of group){
        if(t.status==='done')streak++;
        else break;
      }
      group.forEach(t=>{result[t.id]=streak;});
    });
    return result;
  },[allTasks]);

  const overdue=useMemo(()=>{
    const today=new Date();today.setHours(0,0,0,0);
    return allTasks
      .filter(t=>{if(t.status==='done')return false;const d=new Date(t.dueDate+'T00:00:00');d.setHours(0,0,0,0);return d<today;})
      .sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  },[allTasks]);

  // abiertas = todo lo pendiente: primero lo vencido, despues lo que viene.
  // dentro de cada grupo, de mas vieja a mas nueva.
  const todayMidnight=useMemo(()=>{const d=new Date();d.setHours(0,0,0,0);return d;},[]);
  const openTasks=useMemo(()=>{
    const pend=allTasks.filter(t=>t.status!=='done');
    const byDate=(a,b)=>new Date(a.dueDate+'T00:00:00')-new Date(b.dueDate+'T00:00:00');
    const conFecha=pend.filter(t=>t.dueDate),sinFecha=pend.filter(t=>!t.dueDate);
    const venc=conFecha.filter(t=>isOverdueTask(t,todayMidnight)).sort(byDate);
    const resto=conFecha.filter(t=>!isOverdueTask(t,todayMidnight)).sort(byDate);
    return[...venc,...resto,...sinFecha];
  },[allTasks,todayMidnight]);

  const displayTasks=useMemo(()=>{
    let filtered;
    if(taskFilter==='open')filtered=openTasks;
    else if(taskFilter==='someday')filtered=allTasks.filter(t=>t.status!=='done'&&!t.dueDate);
    else if(taskFilter==='done')filtered=allTasks.filter(t=>t.status==='done');
    else filtered=allTasks;
    if(searchQuery.trim()){const q=searchQuery.toLowerCase();filtered=filtered.filter(t=>t.name.toLowerCase().includes(q)||(t.note||'').toLowerCase().includes(q)||(t.projectName||'').toLowerCase().includes(q));}
    // 'abiertas' ya viene ordenada; 'todas' y 'completadas' van de mas nueva a mas vieja
    if(taskFilter==='all'||taskFilter==='done')return [...filtered].sort((a,b)=>new Date(b.doDate)-new Date(a.doDate));
    return filtered;
  },[allTasks,openTasks,taskFilter,searchQuery]);

  const taskCounts=useMemo(()=>({
    open:openTasks.length,
    someday:allTasks.filter(t=>t.status!=='done'&&!t.dueDate).length,
    all:allTasks.length,
    pending:allTasks.filter(t=>t.status==='pending').length,
    done:allTasks.filter(t=>t.status==='done').length,
  }),[allTasks,openTasks]);

  // projects filtered for projects view
  const filteredProjects=useMemo(()=>{
    if(projStatusFilter==='done') return projects.filter(p=>isProjectDone(p));
    if(projStatusFilter==='all') return projects;
    return projects.filter(p=>!isProjectDone(p));
  },[projects,projStatusFilter]);

  const getAreaProg=id=>{const ap=projects.filter(p=>idEq(p.areaId,id));const t=ap.reduce((s,p)=>s+p.tasks.length,0);const d=ap.reduce((s,p)=>s+p.tasks.filter(t=>t.status==='done').length,0);return t>0?Math.round((d/t)*100):0;};

  const upd=fn=>setData(prev=>({...prev,projects:prev.projects.map(p=>({...p,tasks:fn(p)}))}));
  const toggleTask=id=>setData(prev=>{
    const newProjects=prev.projects.map(p=>{
      if(!p.tasks.some(t=>t.id===id))return p;
      let newTasks=p.tasks.map(t=>{
        if(t.id!==id)return t;
        return{...t,status:t.status==='done'?'pending':'done'};
      });
      const origTask=p.tasks.find(t=>t.id===id);
      const newStatus=origTask.status==='done'?'pending':'done';
      if(newStatus==='done'&&origTask.recur&&origTask.recurMode==='onComplete'){
        // si se completó tarde, avanza hasta la primera fecha que no esté vencida
        let nextDate=nextRecurDate(origTask.dueDate,origTask.recur),steps=1;
        const hoy=todayStr();
        while(nextDate<hoy&&steps<500){nextDate=nextRecurDate(nextDate,origTask.recur);steps++;}
        // preserva el rango hacer→vencer de la instancia actual
        let nextDo=nextDate;
        if(origTask.doDate){nextDo=origTask.doDate;for(let k=0;k<steps;k++)nextDo=nextRecurDate(nextDo,origTask.recur);}
        const idx=(origTask.recurIndex||1)+1;
        newTasks=[...newTasks,{id:uid(),name:`${origTask.recurBase||origTask.name.replace(/ \d+$/,'')} ${idx}`,status:'pending',doDate:nextDo,dueDate:nextDate,note:'',subtasks:[],recur:origTask.recur,recurMode:'onComplete',recurBase:origTask.recurBase||origTask.name,recurIndex:idx}];
      }
      return{...p,tasks:newTasks};
    });
    return{...prev,projects:newProjects};
  });
  const deleteTask=id=>{pushUndo('Tarea eliminada');setPvSheet(null);upd(p=>p.tasks.filter(t=>t.id!==id));};
  const saveNote=(tid,note)=>upd(p=>p.tasks.map(t=>t.id===tid?{...t,note}:t));
  const toggleSubtask=(tid,sid)=>upd(p=>p.tasks.map(t=>t.id===tid?{...t,subtasks:(t.subtasks||[]).map(s=>s.id===sid?{...s,status:s.status==='done'?'pending':'done'}:s)}:t));
  const addSubtask=(tid,name,dueDate)=>upd(p=>p.tasks.map(t=>t.id===tid?{...t,subtasks:[...(t.subtasks||[]),{id:uid(),name,status:'pending',dueDate:dueDate||''}]}:t));
  const deleteSubtask=(tid,sid)=>upd(p=>p.tasks.map(t=>t.id===tid?{...t,subtasks:(t.subtasks||[]).filter(s=>s.id!==sid)}:t));
  const updateSubtaskDate=(tid,sid,dueDate)=>upd(p=>p.tasks.map(t=>t.id===tid?{...t,subtasks:(t.subtasks||[]).map(s=>s.id===sid?{...s,dueDate}:s)}:t));
  const updateSubtaskName=(tid,sid,name)=>upd(p=>p.tasks.map(t=>t.id===tid?{...t,subtasks:(t.subtasks||[]).map(s=>s.id===sid?{...s,name}:s)}:t));

  const openEditTask=task=>{
    const proj=data.projects.find(p=>p.tasks.some(t=>t.id===task.id));
    setEditTaskForm({id:task.id,name:task.name,doDate:task.doDate||'',dueDate:task.dueDate||'',projectId:proj?.id||null,note:task.note||'',recur:task.recur||'',recurMode:task.recurMode||'onComplete',recurEnd:''});
    setShowEditTask(true);
  };
  const updateTask=()=>{
    if(!editTaskForm.name.trim())return;
    const tId=editTaskForm.projectId,taskId=editTaskForm.id;
    setData(prev=>{
      const orig=prev.projects.find(p=>p.tasks.some(t=>t.id===taskId));
      const origId=orig?.id,origTask=orig?.tasks.find(t=>t.id===taskId);
      return{...prev,projects:prev.projects.map(p=>{
        if(idEq(p.id,tId)&&idEq(p.id,origId))return{...p,tasks:p.tasks.map(t=>t.id===taskId?{...t,name:editTaskForm.name,doDate:editTaskForm.doDate,dueDate:editTaskForm.dueDate,note:editTaskForm.note,recur:editTaskForm.recur,recurMode:editTaskForm.recurMode}:t)};
        if(idEq(p.id,tId))return{...p,tasks:[...p.tasks,{id:taskId,name:editTaskForm.name,status:origTask?.status||'pending',doDate:editTaskForm.doDate,dueDate:editTaskForm.dueDate,note:editTaskForm.note,subtasks:origTask?.subtasks||[],recur:editTaskForm.recur,recurMode:editTaskForm.recurMode}]};
        if(idEq(p.id,origId))return{...p,tasks:p.tasks.filter(t=>t.id!==taskId)};
        return p;
      })};
    });
    setShowEditTask(false);
  };
  const addTask=()=>{
    if(!newTask.name.trim()){alert('Ingresá un nombre para la tarea');return;}
    if(!newTask.projectId){alert('Seleccioná un proyecto');return;}
    const today=todayStr();
    if(newTask.recur&&newTask.recurMode==='allAtOnce'&&newTask.recurEnd){
      const tasks=genRecurInstances(newTask.name,newTask.doDate||today,newTask.recurEnd,newTask.recur);
      setData(prev=>({...prev,projects:prev.projects.map(p=>idEq(p.id,newTask.projectId)?{...p,tasks:[...p.tasks,...tasks.map(t=>({...t,recurMode:'allAtOnce'}))]}:p)}));
    } else {
      setData(prev=>({...prev,projects:prev.projects.map(p=>idEq(p.id,newTask.projectId)?{...p,tasks:[...p.tasks,{id:uid(),name:newTask.name,status:'pending',doDate:newTask.doDate||'',dueDate:newTask.dueDate||newTask.doDate||'',note:newTask.note||'',subtasks:[],recur:newTask.recur,recurMode:newTask.recurMode,recurBase:newTask.name}]}:p)}));
    }
    setNewTask({name:'',doDate:'',dueDate:'',projectId:null,note:'',recur:'',recurMode:'onComplete',recurEnd:''});
    setShowNewTask(false);
  };
  const addInlineTask=(pid,name)=>{const today=todayStr();setData(prev=>({...prev,projects:prev.projects.map(p=>idEq(p.id,pid)?{...p,tasks:[...p.tasks,{id:uid(),name,status:'pending',doDate:today,dueDate:today,note:'',subtasks:[]}]}:p)}));};
  const addBatchTasks=(pid,tasks)=>setData(prev=>({...prev,projects:prev.projects.map(p=>String(p.id)===String(pid)?{...p,tasks:[...p.tasks,...tasks]}:p)}));
  const addProject=()=>{if(!newProject.name.trim()){alert('Ingresá un nombre para el proyecto');return;}if(!newProject.areaId){alert('Seleccioná un área');return;}setData(prev=>({...prev,projects:[...prev.projects,{id:uid(),name:newProject.name,description:newProject.description||'',areaId:newProject.areaId,year:yr,startDate:newProject.startDate||todayStr(),endDate:newProject.endDate||'',tasks:[]}]}));setNewProject({name:'',areaId:null,startDate:'',endDate:'',description:''});setShowNewProject(false);};
  const updateProject=(id,u)=>setData(prev=>({...prev,projects:prev.projects.map(p=>idEq(p.id,id)?{...p,...u}:p)}));
  const updateArea=(id,u)=>setData(prev=>({...prev,areas:prev.areas.map(a=>a.id===id?{...a,...u}:a)}));
  const deleteArea=id=>{const projCount=data.projects.filter(p=>idEq(p.areaId,id)).length;if(!confirm(`⚠️ Esto elimina el área y sus ${projCount} proyecto(s) con todas sus tareas. ¿Continuar?`))return;pushUndo('Área eliminada');setData(prev=>({...prev,areas:prev.areas.filter(a=>a.id!==id),projects:prev.projects.filter(p=>!idEq(p.areaId,id))}));setSelAreaId(null);};
  const addArea=()=>{if(!newArea.name.trim()){alert('Ingresá un nombre para el área');return;}setData(prev=>({...prev,areas:[...prev.areas,{id:uid(),...newArea}]}));setNewArea({name:'',emoji:'📁',vision:'',color:'#ff647c'});setShowNewArea(false);};
  const openEditProject=proj=>setEditingProject({id:proj.id,name:proj.name,description:proj.description||'',startDate:proj.startDate||'',endDate:proj.endDate||''});
  const saveEditProject=()=>{if(!editingProject?.name?.trim())return;updateProject(editingProject.id,{name:editingProject.name,description:editingProject.description,startDate:editingProject.startDate,endDate:editingProject.endDate});setEditingProject(null);};
  const addInboxItem=()=>{if(!newInbox.trim())return;setData(prev=>({...prev,inbox:[...prev.inbox,{id:uid(),text:newInbox,timestamp:new Date().toISOString()}]}));setNewInbox('');setShowInboxCap(false);};
  const updateInboxItem=id=>{if(!editInboxText.trim())return;setData(prev=>({...prev,inbox:prev.inbox.map(i=>i.id===id?{...i,text:editInboxText}:i)}));setEditInboxId(null);};
  const deleteInboxItem=id=>setData(prev=>({...prev,inbox:prev.inbox.filter(i=>i.id!==id)}));
  const assignInbox=(inboxId,projectId)=>{const item=data.inbox.find(i=>i.id===inboxId);if(!item)return;const today=todayStr();setData(prev=>({...prev,projects:prev.projects.map(p=>idEq(p.id,projectId)?{...p,tasks:[...p.tasks,{id:uid(),name:item.text,status:'pending',doDate:today,dueDate:today,note:'',subtasks:[]}]}:p),inbox:prev.inbox.filter(i=>i.id!==inboxId)}));setAssignInboxId(null);};
  const exportData=()=>{const b=new Blob([JSON.stringify({...data,exportDate:new Date().toISOString()},null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`aptr-${todayStr()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);setShowMenu(false);};
  const importData=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.areas&&d.projects&&d.inbox){setData({areas:d.areas,projects:d.projects,inbox:d.inbox});alert('✅ Importado');}else alert('❌ Formato inválido');}catch{alert('❌ Error');}};r.readAsText(f);if(e.target)e.target.value='';setShowMenu(false);};

  const cardProps={onToggle:toggleTask,onEdit:openEditTask,onDelete:deleteTask,onNavigate:()=>setView('projects'),onToggleSubtask:toggleSubtask,onAddSubtask:addSubtask,onDeleteSubtask:deleteSubtask,onUpdateSubtaskDate:updateSubtaskDate,onUpdateSubtaskName:updateSubtaskName,onSaveNote:saveNote,streaks};
  const todayLabel=(()=>{const s=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1);})();

  return(
    <div className="root">
      <style>{S}</style>
      <header className="hdr">
        <div className="hdr-in">
          <div className="hdr-top">
            <div className="logo">APT<span>R</span><span className="badge">{yr}</span></div>
            <div style={{display:'flex',alignItems:'center',gap:7,position:'relative'}}>
              <span aria-live="polite" title={syncStatus==='synced'?'Sincronizado':syncStatus==='saving'?'Guardando...':syncStatus==='error'?'Error de sync':'Conectando...'} style={{width:8,height:8,borderRadius:'50%',background:syncStatus==='synced'?'#0f8a4a':syncStatus==='saving'?'#9a6a00':syncStatus==='error'?'#c8324a':'#bbbab2',transition:'background .3s',flexShrink:0}}/>
              {overdue.length>0&&<span style={{fontSize:11,color:'var(--rd)',background:'var(--rdd)',border:'1px solid #ef444330',borderRadius:20,padding:'2px 8px',fontWeight:600}}>{overdue.length} vencidas</span>}
              <button className="btn-icon" aria-label="Menú" onClick={()=>setShowMenu(!showMenu)}><MoreVertical size={17}/></button>
              {showMenu&&(<>
                <div style={{position:'fixed',inset:0,zIndex:49}} onClick={()=>setShowMenu(false)}/>
                <div className="dd-menu">
                  <button className="dd-item" onClick={exportData}><Download size={13}/> Exportar</button>
                  <label className="dd-item" style={{cursor:'pointer'}}><Upload size={13}/> Importar<input type="file" accept=".json" onChange={importData} style={{display:'none'}}/></label>
                  <div className="dd-div"/>
                  <button className="dd-item" onClick={()=>{if(confirm('⚠️ Esto reemplaza TODOS tus datos con los de ejemplo. ¿Continuar?')){setData(getInitialData());setShowMenu(false);}}}><Sparkles size={13}/> Sample data</button>
                  <button className="dd-item danger" onClick={()=>{if(confirm('⚠️ Esto elimina TODOS tus datos permanentemente. ¿Continuar?')){localStorage.removeItem('aptr-v14');localStorage.removeItem('aptr-v14-backup');setData(getInitialData());setShowMenu(false);}}}><Trash2 size={13}/> Resetear</button>
                </div>
              </>)}
            </div>
          </div>
          <nav className="nav" role="navigation" aria-label="Navegación principal">
            {[{id:'inbox',label:'Inbox',ic:<Inbox size={12}/>,badge:data.inbox.length||null},{id:'areas',label:'Áreas',ic:<Target size={12}/>},{id:'projects',label:'Proyectos',ic:<Layers size={12}/>},{id:'tasks',label:'Tareas',ic:<CheckSquare size={12}/>},{id:'calendar',label:'Calendario',ic:<Calendar size={12}/>}].map(t=>(
              <button key={t.id} className={`nav-btn${view===t.id?' on':''}`} onClick={()=>{setView(t.id);setSelAreaId(null);}}>{t.ic}{t.label}{t.badge!=null&&<span className="nav-pill">{t.badge}</span>}</button>
            ))}
          </nav>
        </div>
      </header>

      <main className="main" role="main">

        {/* ── TASKS ── */}
        {view==='tasks'&&(
          <>
            <div className="sec-hdr">
              <div><h2 className="sec-title">Tareas</h2><p className="sec-sub">{taskCounts.pending} pendientes · {taskCounts.done} completadas</p></div>
              <div style={{display:'flex',gap:7}}>
                <button className="btn btn-ghost" onClick={()=>setShowBatch(true)}><Copy size={13}/> Lote</button>
                <button className="btn btn-pri" onClick={()=>setShowNewTask(true)}><Plus size={14}/> Tarea</button>
              </div>
            </div>
            <div className="search-bar" role="search" aria-label="Buscar tareas">
              <Search size={14} style={{color:'var(--tx3)',flexShrink:0}}/>
              <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Buscar tareas, notas, proyectos…"/>
              {searchQuery&&<button className="btn-icon" onClick={()=>setSearchQuery('')} style={{padding:2}}><X size={13}/></button>}
            </div>
            <div className="filters">
              {[{id:'open',l:'Abiertas',c:taskCounts.open},{id:'all',l:'Todas',c:taskCounts.all},{id:'done',l:'Completadas',c:taskCounts.done},{id:'someday',l:'Algún día',c:taskCounts.someday}].map(f=>(
                <button key={f.id} className={`fp${taskFilter===f.id?' on':''}`} onClick={()=>setTaskFilter(f.id)}>{f.l} {f.c}</button>
              ))}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:7}}>
              {displayTasks.length===0?<div className="empty"><Circle size={38} style={{margin:'0 auto 10px',opacity:.2}}/><div className="empty-title">{searchQuery?'Sin resultados':'Sin tareas'}</div></div>:displayTasks.map((t,i)=>{
                const ant=i>0?displayTasks[i-1]:null;
                const sep=taskFilter==='open'&&ant&&!!t.dueDate&&isOverdueTask(ant,todayMidnight)&&!isOverdueTask(t,todayMidnight);
                const sepAlg=taskFilter==='open'&&!t.dueDate&&(i===0||!!ant.dueDate);
                return(
                  <React.Fragment key={t.id}>
                    {sep&&<div className="task-sep"><span>Próximas</span></div>}
                    {sepAlg&&<div className="task-sep"><span>Algún día</span></div>}
                    <TaskCard task={t} {...cardProps}/>
                  </React.Fragment>
                );
              })}
            </div>
          </>
        )}

        {/* ── AREAS ── */}
        {view==='areas'&&(
          selAreaId?(()=>{
            const area=data.areas.find(a=>a.id===selAreaId);if(!area)return null;
            const ap=projects.filter(p=>idEq(p.areaId,selAreaId));
            const prog=getAreaProg(selAreaId);
            return(
              <div>
                <button className="back-btn" onClick={()=>setSelAreaId(null)}><ArrowLeft size={14}/> Áreas</button>
                <div style={{background:'var(--sf2)',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:'18px 22px',marginBottom:22,position:'relative',overflow:'hidden'}}>
                  <div style={{position:'absolute',top:0,left:0,right:0,height:4,background:area.color}}/>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div style={{flex:1}}>
                      <span style={{fontSize:36,display:'block',marginBottom:7}}>{area.emoji}</span>
                      {editingAreaId===selAreaId?(
                        <div style={{display:'flex',flexDirection:'column',gap:10}}>
                          <div style={{display:'flex',gap:9}}><input className="finput" style={{width:52,textAlign:'center',fontSize:20}} value={area.emoji} onChange={e=>updateArea(selAreaId,{emoji:e.target.value})}/><input className="finput" style={{flex:1}} value={area.name} onChange={e=>updateArea(selAreaId,{name:e.target.value})}/></div>
                          <textarea className="finput" rows={2} value={area.vision} onChange={e=>updateArea(selAreaId,{vision:e.target.value})}/>
                          <input type="color" value={area.color} onChange={e=>updateArea(selAreaId,{color:e.target.value})} style={{height:34,borderRadius:6,border:'1px solid var(--bdh)',cursor:'pointer',width:56}}/>
                          <div style={{display:'flex',gap:8}}><button className="btn btn-pri btn-sm" onClick={()=>setEditingAreaId(null)}>Guardar</button><button className="btn btn-danger btn-sm" onClick={()=>deleteArea(selAreaId)}>Eliminar área</button></div>
                        </div>
                      ):(
                        <><div style={{fontFamily:'Space Grotesk,system-ui,sans-serif',fontSize:22,fontWeight:800,marginBottom:3}}>{area.name}</div><div style={{fontSize:13,color:'var(--tx2)',fontStyle:'italic'}}>{area.vision}</div></>
                      )}
                    </div>
                    {editingAreaId!==selAreaId&&<button className="btn-icon" onClick={()=>setEditingAreaId(selAreaId)}><Edit2 size={15}/></button>}
                  </div>
                  <div style={{marginTop:14,display:'flex',alignItems:'center',gap:9}}>
                    <div className="pbar" style={{height:5}}><div className="pfill" style={{width:`${prog}%`,backgroundColor:getProgressColor(prog)}}/></div>
                    <span style={{fontSize:12,color:'var(--tx2)',minWidth:36}}>{prog}%</span>
                  </div>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                  <h3 style={{fontFamily:'Space Grotesk,system-ui,sans-serif',fontSize:15,fontWeight:700,margin:0}}>Proyectos ({ap.length})</h3>
                  <button className="btn btn-ghost btn-sm" onClick={()=>{setNewProject({...newProject,areaId:selAreaId});setShowNewProject(true);}}><Plus size={12}/> Proyecto</button>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:10}}>
                  {ap.map(p=>{const d=p.tasks.filter(t=>t.status==='done').length,tot=p.tasks.length,pct=tot>0?Math.round((d/tot)*100):0,pc=getProgressColor(pct);return(
                    <div key={p.id} style={{background:'var(--sf2)',border:'1px solid var(--bd)',borderRadius:'var(--r)',overflow:'hidden',position:'relative',cursor:'pointer',transition:'border-color .15s'}} onClick={()=>setView('projects')}>
                      <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:area.color}}/>
                      <div style={{padding:'15px 15px 11px'}}>
                        <div style={{fontFamily:'Space Grotesk,system-ui,sans-serif',fontSize:14,fontWeight:700,marginBottom:10}}>{p.name}</div>
                        <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:8}}><div style={{flex:1,height:5,background:'var(--sf3)',borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',borderRadius:3,background:pc,width:`${pct}%`,transition:'width .5s ease'}}/></div><span style={{fontFamily:'Space Grotesk,system-ui,sans-serif',fontSize:12,fontWeight:700,color:pc}}>{pct}%</span></div>
                        <span style={{fontSize:11,color:'var(--tx3)'}}>{d}/{tot} tareas</span>
                      </div>
                    </div>
                  );})}
                </div>
              </div>
            );
          })():(
            <div>
              <div className="sec-hdr"><div><h2 className="sec-title">Áreas de vida</h2><p className="sec-sub">{data.areas.length} áreas activas</p></div><button className="btn btn-pri" onClick={()=>setShowNewArea(true)}><Plus size={14}/> Nueva área</button></div>
              <div className="areas-grid">
                {data.areas.map(area=>{const prog=getAreaProg(area.id);return(
                  <div key={area.id} className="area-card" style={{'--area-color':area.color}} onClick={()=>setSelAreaId(area.id)}>
                    <span className="area-emoji">{area.emoji}</span>
                    <div className="area-name">{area.name}</div>
                    <div className="area-vision">{area.vision}</div>
                    <div className="area-stats"><div className="pbar"><div className="pfill" style={{width:`${prog}%`,backgroundColor:getProgressColor(prog)}}/></div><span style={{fontSize:10,color:'var(--tx3)',whiteSpace:'nowrap'}}>{projects.filter(p=>idEq(p.areaId,area.id)).length} proy.</span></div>
                  </div>
                );})}
              </div>
            </div>
          )
        )}

        {/* ── PROJECTS ── */}
        {view==='projects'&&(
          <div>
            <div className="sec-hdr">
              <div><h2 className="sec-title">Proyectos</h2><p className="sec-sub">{projects.length} en {yr}</p></div>
              <div style={{display:'flex',gap:7}}>
                <button className="btn btn-ghost" onClick={()=>setShowBatch(true)}><Copy size={13}/> Lote</button>
                <button className="btn btn-pri" onClick={()=>setShowNewProject(true)}><Plus size={14}/> Proyecto</button>
              </div>
            </div>

            {/* Filtros de proyectos — solo por estado */}
            <div className="proj-filter-bar">
              <Filter size={12} style={{color:'var(--tx3)',flexShrink:0}}/>
              {[{id:'pending',l:'Pendientes'},{id:'done',l:'Completadas'},{id:'all',l:'Todas'}].map(f=>(
                <button key={f.id} className={`proj-fp${projStatusFilter===f.id?' on':''}`} onClick={()=>setProjStatusFilter(f.id)}>{f.l}</button>
              ))}
            </div>

            {data.areas.map(area=>{
              const ap=filteredProjects.filter(p=>idEq(p.areaId,area.id));
              if(!ap.length)return null;
              return(
                <div key={area.id} className="pv-grp">
                  <div className="pv-grp-hdr"><span className="pv-grp-dot" style={{background:area.color}}/><span className="pv-grp-name">{area.emoji} {area.name}</span><span style={{fontSize:11,color:'var(--tx3)'}}>{ap.length}</span></div>
                  {ap.map(project=>(
                    <PVProjectCard key={project.id} project={project} area={area}
                      onToggleTask={toggleTask} onEditTask={openEditTask}
                      onDeleteTask={deleteTask} onOpenSheet={setPvSheet}
                      onAddInlineTask={addInlineTask} onEditProject={openEditProject}
                      onToggleSubtask={toggleSubtask} onAddSubtask={addSubtask} onDeleteSubtask={deleteSubtask} onUpdateSubtaskDate={updateSubtaskDate} onUpdateSubtaskName={updateSubtaskName}
                      statusFilter={projStatusFilter} showArea={false}/>
                  ))}
                </div>
              );
            })}
            <BottomSheet task={pvSheet} onClose={()=>setPvSheet(null)} onEdit={openEditTask} onDelete={deleteTask}/>
          </div>
        )}

        {/* ── CALENDAR ── */}
        {view==='calendar'&&(
          (()=>{
            const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
            let startDow=new Date(calYear,calMonth,1).getDay()-1;if(startDow<0)startDow=6;
            const todayD=new Date();todayD.setHours(0,0,0,0);
            const todayYMD=todayD.toISOString().split('T')[0];
            const pad2=n=>String(n).padStart(2,'0');
            const monthPfx=`${calYear}-${pad2(calMonth+1)}`;
            // Assign each task to a single day:
            // - done → stays on doDate (or dueDate)
            // - pending & date passed → moves to today
            // - pending & future → stays on doDate
            const tasksByDay={};
            const addToDay=(item)=>{
              const taskDate=item.doDate||item.dueDate;
              let showOn;
              if(item.status==='done'){showOn=taskDate;}
              else{showOn=taskDate<todayYMD?todayYMD:taskDate;}
              if(!showOn.startsWith(monthPfx))return;
              if(!tasksByDay[showOn])tasksByDay[showOn]=[];
              tasksByDay[showOn].push(item);
            };
            allTasks.forEach(addToDay);
            allSubtasks.forEach(addToDay);
            const cells=[];
            for(let i=0;i<startDow;i++)cells.push({empty:true,key:'e'+i});
            for(let d=1;d<=daysInMonth;d++){
              const ds=`${monthPfx}-${pad2(d)}`;
              const dayTasks=tasksByDay[ds]||[];
              const isT=ds===todayYMD;
              const isSel=ds===calSelDay;
              cells.push({empty:false,day:d,ds,dayTasks,isT,isSel,key:'d'+d});
            }
            const selDayTasks=calSelDay?(tasksByDay[calSelDay]||[]):[];
            const selDayDate=calSelDay?new Date(calSelDay+'T00:00:00'):null;
            const calPrev=()=>{if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1);setCalSelDay(null);};
            const calNext=()=>{if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1);setCalSelDay(null);};
            return(
              <>
                <div className="sec-hdr">
                  <div><h2 className="sec-title">Calendario</h2><p className="sec-sub">Vista mensual de tareas</p></div>
                  <button className="btn btn-pri" onClick={()=>setShowNewTask(true)}><Plus size={14}/> Tarea</button>
                </div>
                <div className="cal-hdr">
                  <div className="cal-nav"><button onClick={calPrev}><ArrowLeft size={14}/></button></div>
                  <span className="cal-month">{MES_LARGO[calMonth]} {calYear}</span>
                  <div className="cal-nav"><button onClick={calNext}><ArrowLeft size={14} style={{transform:'rotate(180deg)'}}/></button></div>
                </div>
                <div className="cal-grid">
                  {['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=><div key={d} className="cal-dow">{d}</div>)}
                  {cells.map(c=>c.empty?<div key={c.key} className="cal-day empty"/>:(
                    <div key={c.key} className={`cal-day${c.isT?' today':''}${c.isSel?' selected':''}`} onClick={()=>setCalSelDay(c.ds)}>
                      <div className="cal-daynum">
                        <span>{c.day}</span>
                        {c.dayTasks.length>0&&<span className="cal-count">{c.dayTasks.length}</span>}
                      </div>
                      <div className="cal-tasks">
                        {c.dayTasks.slice(0,4).map((t,i)=>{
                          const cls=t.status==='done'?'done':(t.doDate||t.dueDate)<todayYMD?'overdue':c.isT?'today-task':'pending';
                          const label=t.isSubtask?`↳ ${t.name}`:t.name;
                          const title=t.isSubtask?`${t.projectName} — ${t.parentTaskName} → ${t.name}`:`${t.projectName} — ${t.name}`;
                          return <div key={t.id+'-'+i} className={`cal-task ${cls}`} style={{'--cal-area-color':t.areaColor,display:'flex',alignItems:'center',gap:3}} title={title}>
                            <span style={{flexShrink:0,cursor:'pointer',display:'inline-flex'}} onClick={e=>{e.stopPropagation();if(!t.isSubtask)toggleTask(t.id);else toggleSubtask(t.parentTaskId,t.id);}}>{t.status==='done'?<CheckCircle2 size={10}/>:<Circle size={10}/>}</span>
                            <span style={{overflow:'hidden',textOverflow:'ellipsis',cursor:t.isSubtask?'default':'pointer'}} onClick={e=>{e.stopPropagation();if(!t.isSubtask)openEditTask(t);}}>{label}</span>
                          </div>;
                        })}
                        {c.dayTasks.length>4&&<span className="cal-more">+{c.dayTasks.length-4} más</span>}
                      </div>
                    </div>
                  ))}
                </div>
                {calSelDay&&(
                  <div className="cal-daytasks">
                    <div className="cal-daytasks-hdr">
                      <div>
                        <span className="cal-daytasks-title">Tareas del día</span>
                        <span className="cal-daytasks-date" style={{marginLeft:8}}>{selDayDate?selDayDate.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}):''}</span>
                      </div>
                      <button className="btn btn-pri btn-sm" onClick={()=>{setNewTask({name:'',doDate:calSelDay,dueDate:calSelDay,projectId:null,note:'',recur:'',recurMode:'onComplete',recurEnd:''});setShowNewTask(true);}}><Plus size={12}/> Agregar</button>
                    </div>
                    {selDayTasks.length===0?<div className="empty" style={{padding:'24px 20px'}}><div className="empty-title">Sin tareas</div><p style={{fontSize:12}}>No hay tareas para este día</p></div>:(
                      <div style={{display:'flex',flexDirection:'column',gap:7}}>
                        {selDayTasks.map(t=><TaskCard key={t.id} task={t} {...cardProps}/>)}
                      </div>
                    )}
                  </div>
                )}
              </>
            );
          })()
        )}

        {/* ── INBOX ── */}
        {view==='inbox'&&(
          <div>
            <div className="sec-hdr"><div><h2 className="sec-title">Inbox</h2><p className="sec-sub">Capturá ideas, procesalas después</p></div><button className="btn btn-pri" onClick={()=>{setShowInboxCap(true);setTimeout(()=>inboxRef.current?.focus(),50);}}><Plus size={14}/> Agregar</button></div>
            <div className="verse-card">
              <div className="verse-text">"{dailyVerse.text}"</div>
              <div className="verse-ref"><Sparkles size={11}/>{dailyVerse.ref}</div>
            </div>
            {showInboxCap&&(
              <div className="ic"><input ref={inboxRef} value={newInbox} onChange={e=>setNewInbox(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addInboxItem();if(e.key==='Escape')setShowInboxCap(false);}} placeholder="¿Qué querés capturar? (Enter)"/><button className="btn btn-pri btn-sm" onClick={addInboxItem}>Guardar</button><button className="btn-icon" onClick={()=>setShowInboxCap(false)}><X size={15}/></button></div>
            )}
            {data.inbox.length===0?(<div className="empty"><Inbox size={38} style={{margin:'0 auto 10px',opacity:.2}}/><div className="empty-title">Inbox vacío</div><p>Usalo para captura rápida de ideas</p></div>):(
              <div style={{display:'flex',flexDirection:'column',gap:7}}>
                {data.inbox.map(item=>(
                  <div key={item.id} className="ib-card">
                    {editInboxId===item.id?(
                      <div style={{display:'flex',flexDirection:'column',gap:9}}>
                        <textarea className="finput" value={editInboxText} onChange={e=>setEditInboxText(e.target.value)} rows={2} autoFocus/>
                        <div style={{display:'flex',gap:7}}><button className="btn btn-pri btn-sm" onClick={()=>updateInboxItem(item.id)}>Guardar</button><button className="btn btn-ghost btn-sm" onClick={()=>setEditInboxId(null)}>Cancelar</button></div>
                      </div>
                    ):(
                      <>
                        <div className="ib-text">{item.text}</div>
                        <div className="ib-foot">
                          <span className="ib-ts">{new Date(item.timestamp).toLocaleDateString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
                          <div style={{display:'flex',gap:4}}>
                            <button className="btn btn-ghost btn-sm" onClick={()=>setAssignInboxId(assignInboxId===item.id?null:item.id)}><Layers size={11}/> Asignar</button>
                            <button className="btn-icon" onClick={()=>{setEditInboxId(item.id);setEditInboxText(item.text);}}><Edit2 size={13}/></button>
                            <button className="btn-icon" style={{color:'var(--rd)'}} onClick={()=>deleteInboxItem(item.id)}><Trash2 size={13}/></button>
                          </div>
                        </div>
                        {assignInboxId===item.id&&(
                          <div style={{marginTop:11,paddingTop:11,borderTop:'1px solid var(--bd)'}}>
                            <div style={{fontSize:10,fontWeight:600,letterSpacing:'.6px',textTransform:'uppercase',color:'var(--tx3)',marginBottom:9}}>Asignar a proyecto</div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5,maxHeight:160,overflowY:'auto'}}>
                              {projects.map(p=>{const ar=data.areas.find(a=>idEq(a.id,p.areaId));return(
                                <button key={p.id} style={{background:'var(--sf3)',border:'1px solid var(--bd)',borderRadius:7,padding:'9px 10px',cursor:'pointer',textAlign:'left',transition:'border-color .15s'}} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--ac)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--bd)'} onClick={()=>assignInbox(item.id,p.id)}>
                                  <div style={{fontSize:10,color:'var(--tx3)',marginBottom:2,display:'flex',gap:3,alignItems:'center'}}><span style={{width:5,height:5,borderRadius:'50%',background:ar?.color,display:'inline-block'}}/>{ar?.emoji} {ar?.name}</div>
                                  <div style={{fontSize:12,fontWeight:500,color:'var(--tx)'}}>{p.name}</div>
                                </button>
                              );})}
                            </div>
                            <button className="btn-icon" style={{marginTop:7,fontSize:12,color:'var(--tx3)'}} onClick={()=>setAssignInboxId(null)}>Cancelar</button>
                          </div>
                        )}
                      </>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </main>

      {/* MODALS */}
      {showBatch&&<BatchModal projects={projects} areas={data.areas} onClose={()=>setShowBatch(false)} onAdd={addBatchTasks}/>}
      {editingProject&&(
        <Modal title="Editar proyecto" onClose={()=>setEditingProject(null)}>
          <div><label className="flabel">Nombre</label><input className="finput" autoFocus value={editingProject.name} onChange={e=>setEditingProject({...editingProject,name:e.target.value})} onKeyDown={e=>e.key==='Enter'&&saveEditProject()}/></div>
          <div><label className="flabel">Descripción</label><textarea className="finput" rows={3} value={editingProject.description} onChange={e=>setEditingProject({...editingProject,description:e.target.value})}/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label className="flabel">Inicio</label><input type="date" className="finput" value={editingProject.startDate} onChange={e=>setEditingProject({...editingProject,startDate:e.target.value})}/></div>
            <div><label className="flabel">Fin</label><input type="date" className="finput" value={editingProject.endDate} onChange={e=>setEditingProject({...editingProject,endDate:e.target.value})}/></div>
          </div>
          <button className="btn btn-pri" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={saveEditProject}>Guardar</button>
          <button className="btn btn-danger" style={{width:'100%',justifyContent:'center',padding:'9px'}} onClick={()=>{if(!confirm('⚠️ Esto elimina el proyecto y todas sus tareas. ¿Continuar?'))return;pushUndo('Proyecto eliminado');setData(prev=>({...prev,projects:prev.projects.filter(p=>String(p.id)!==String(editingProject.id))}));setEditingProject(null);}}><Trash2 size={12}/> Eliminar proyecto</button>
        </Modal>
      )}
      {showNewTask&&(
        <Modal title="Nueva tarea" onClose={()=>setShowNewTask(false)}>
          <div><label className="flabel">Nombre</label><input className="finput" autoFocus value={newTask.name} onChange={e=>setNewTask({...newTask,name:e.target.value})} onKeyDown={e=>e.key==='Enter'&&addTask()} placeholder="¿Qué hay que hacer?"/></div>
          <div><label className="flabel">Proyecto</label>
            <select className="finput fselect" value={newTask.projectId||''} onChange={e=>setNewTask({...newTask,projectId:e.target.value})}>
              <option value="">Seleccionar proyecto...</option>
              {projects.map(p=>{const a=data.areas.find(a=>idEq(a.id,p.areaId));return<option key={p.id} value={p.id}>{a?.emoji} {p.name}</option>;})}
            </select>
          </div>
          <div className="qd-row">
            <button type="button" className="qd-btn" onClick={()=>setNewTask({...newTask,doDate:todayStr(),dueDate:todayStr()})}>Hoy</button>
            <button type="button" className="qd-btn" onClick={()=>setNewTask({...newTask,doDate:tomorrowStr(),dueDate:tomorrowStr()})}>Mañana</button>
            <button type="button" className="qd-btn" onClick={()=>setNewTask({...newTask,doDate:nextMondayStr(),dueDate:nextMondayStr()})}>Lunes</button>
            <button type="button" className="qd-btn" onClick={()=>setNewTask({...newTask,doDate:nextMondayStr(),dueDate:nextFridayStr()})}>Próx. semana</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label className="flabel">Inicio</label><input type="date" className="finput" value={newTask.doDate} onChange={e=>setNewTask({...newTask,doDate:e.target.value})}/></div>
            <div><label className="flabel">Límite</label><input type="date" className="finput" value={newTask.dueDate} onChange={e=>setNewTask({...newTask,dueDate:e.target.value})}/></div>
          </div>
          <div><label className="flabel">Nota</label><textarea className="finput" rows={2} value={newTask.note} onChange={e=>setNewTask({...newTask,note:e.target.value})} placeholder="Contexto, link…"/></div>
          <RecurSection recur={newTask.recur} setRecur={v=>setNewTask({...newTask,recur:v})} recurMode={newTask.recurMode} setRecurMode={v=>setNewTask({...newTask,recurMode:v})} recurEnd={newTask.recurEnd} setRecurEnd={v=>setNewTask({...newTask,recurEnd:v})}/>
          <button className="btn btn-pri" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={addTask}>{newTask.recur&&newTask.recurMode==='allAtOnce'&&newTask.recurEnd?'Crear todas las instancias':'Crear tarea'}</button>
        </Modal>
      )}
      {showNewProject&&(
        <Modal title="Nuevo proyecto" onClose={()=>setShowNewProject(false)}>
          <div><label className="flabel">Nombre</label><input className="finput" autoFocus value={newProject.name} onChange={e=>setNewProject({...newProject,name:e.target.value})} placeholder="Nombre del proyecto..."/></div>
          <div><label className="flabel">Descripción</label><textarea className="finput" rows={2} value={newProject.description} onChange={e=>setNewProject({...newProject,description:e.target.value})} placeholder="Descripción opcional..."/></div>
          <div><label className="flabel">Área</label>
            <select className="finput fselect" value={newProject.areaId||''} onChange={e=>setNewProject({...newProject,areaId:e.target.value})}>
              <option value="">Seleccionar área...</option>
              {data.areas.map(a=><option key={a.id} value={a.id}>{a.emoji} {a.name}</option>)}
            </select>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label className="flabel">Inicio</label><input type="date" className="finput" value={newProject.startDate} onChange={e=>setNewProject({...newProject,startDate:e.target.value})}/></div>
            <div><label className="flabel">Fin</label><input type="date" className="finput" value={newProject.endDate} onChange={e=>setNewProject({...newProject,endDate:e.target.value})}/></div>
          </div>
          <button className="btn btn-pri" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={addProject}>Crear proyecto</button>
        </Modal>
      )}
      {showNewArea&&(
        <Modal title="Nueva área" onClose={()=>setShowNewArea(false)}>
          <div style={{display:'flex',gap:9}}>
            <div><label className="flabel">Emoji</label><input className="finput" style={{width:52,textAlign:'center',fontSize:20}} value={newArea.emoji} onChange={e=>setNewArea({...newArea,emoji:e.target.value})}/></div>
            <div style={{flex:1}}><label className="flabel">Nombre</label><input className="finput" autoFocus value={newArea.name} onChange={e=>setNewArea({...newArea,name:e.target.value})} placeholder="Nombre del área..."/></div>
          </div>
          <div><label className="flabel">Visión</label><textarea className="finput" rows={3} value={newArea.vision} onChange={e=>setNewArea({...newArea,vision:e.target.value})} placeholder="¿Qué querés lograr?"/></div>
          <div><label className="flabel">Color</label><input type="color" value={newArea.color} onChange={e=>setNewArea({...newArea,color:e.target.value})} style={{height:38,width:'100%',borderRadius:7,border:'1px solid var(--bdh)',cursor:'pointer',background:'var(--sf3)'}}/></div>
          <button className="btn btn-pri" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={addArea}>Crear área</button>
        </Modal>
      )}
      {undoStack&&(
        <div className="undo-toast">
          <span>{undoStack.msg}</span>
          <button className="btn btn-pri btn-sm" onClick={doUndo}>Deshacer</button>
        </div>
      )}
      {showEditTask&&(
        <Modal title="Editar tarea" onClose={()=>setShowEditTask(false)}>
          <div><label className="flabel">Nombre</label><input className="finput" autoFocus value={editTaskForm.name} onChange={e=>setEditTaskForm({...editTaskForm,name:e.target.value})} onKeyDown={e=>e.key==='Enter'&&updateTask()}/></div>
          <div><label className="flabel">Proyecto</label>
            <select className="finput fselect" value={editTaskForm.projectId||''} onChange={e=>setEditTaskForm({...editTaskForm,projectId:e.target.value})}>
              <option value="">Seleccionar...</option>
              {projects.map(p=>{const a=data.areas.find(a=>idEq(a.id,p.areaId));return<option key={p.id} value={p.id}>{a?.emoji} {p.name}</option>;})}
            </select>
          </div>
          <div className="qd-row">
            <button type="button" className="qd-btn" onClick={()=>setEditTaskForm({...editTaskForm,doDate:todayStr(),dueDate:todayStr()})}>Hoy</button>
            <button type="button" className="qd-btn" onClick={()=>setEditTaskForm({...editTaskForm,doDate:tomorrowStr(),dueDate:tomorrowStr()})}>Mañana</button>
            <button type="button" className="qd-btn" onClick={()=>setEditTaskForm({...editTaskForm,doDate:nextMondayStr(),dueDate:nextMondayStr()})}>Lunes</button>
            <button type="button" className="qd-btn" onClick={()=>setEditTaskForm({...editTaskForm,doDate:nextMondayStr(),dueDate:nextFridayStr()})}>Próx. semana</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div><label className="flabel">Inicio</label><input type="date" className="finput" value={editTaskForm.doDate} onChange={e=>setEditTaskForm({...editTaskForm,doDate:e.target.value})}/></div>
            <div><label className="flabel">Límite</label><input type="date" className="finput" value={editTaskForm.dueDate} onChange={e=>setEditTaskForm({...editTaskForm,dueDate:e.target.value})}/></div>
          </div>
          <div><label className="flabel">Nota</label><textarea className="finput" rows={3} value={editTaskForm.note} onChange={e=>setEditTaskForm({...editTaskForm,note:e.target.value})} placeholder="Contexto, links…"/></div>
          <RecurSection recur={editTaskForm.recur} setRecur={v=>setEditTaskForm({...editTaskForm,recur:v})} recurMode={editTaskForm.recurMode} setRecurMode={v=>setEditTaskForm({...editTaskForm,recurMode:v})} recurEnd={editTaskForm.recurEnd} setRecurEnd={v=>setEditTaskForm({...editTaskForm,recurEnd:v})}/>
          <button className="btn btn-pri" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={updateTask}>Guardar cambios</button>
          <button className="btn btn-danger" style={{width:'100%',justifyContent:'center',padding:'9px'}} onClick={()=>{deleteTask(editTaskForm.id);setShowEditTask(false);}}><Trash2 size={12}/> Eliminar tarea</button>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<APTRPlanner/>);
</script>
</body>
</html>
